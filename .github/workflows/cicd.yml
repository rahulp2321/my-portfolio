name: Next.js CI/CD Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_NAME: nextjs-app
  AWS_REGION: ${{ secrets.AWS_REGION }}         # e.g. ap-south-1
  S3_BUCKET: ${{ secrets.S3_BUCKET }}           # your-bucket-name
  EC2_HOST: ${{ secrets.EC2_HOST }}             # e.g. 13.x.x.x
  EC2_USER: ${{ secrets.EC2_USER }}             # e.g. ec2-user
  CONTAINER_PORT: 80   # nginx serves on 80 inside the container
  HOST_PORT: 80

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build Docker image, push tar to S3, keep only last 3 tags
  # ─────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build → S3
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Derive a unique tag from branch + short SHA ──────────────────────
      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${{ env.APP_NAME }}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: ${TAG}"

      # ── Build the Docker image ───────────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ env.APP_NAME }}:${{ steps.meta.outputs.tag }}" \
            --tag "${{ env.APP_NAME }}:latest" \
            .

      # ── Save image as a tar archive ──────────────────────────────────────
      - name: Save image as tar
        run: |
          mkdir -p artifacts
          docker save "${{ env.APP_NAME }}:${{ steps.meta.outputs.tag }}" \
            | gzip > "artifacts/${{ steps.meta.outputs.tag }}.tar.gz"
          echo "Archive size: $(du -sh artifacts/${{ steps.meta.outputs.tag }}.tar.gz | cut -f1)"

      # ── Configure AWS credentials ────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── Upload the tar to S3 ─────────────────────────────────────────────
      - name: Upload image tar to S3
        run: |
          aws s3 cp \
            "artifacts/${{ steps.meta.outputs.tag }}.tar.gz" \
            "s3://${{ env.S3_BUCKET }}/docker-images/${{ steps.meta.outputs.tag }}.tar.gz"
          echo "Uploaded to s3://${{ env.S3_BUCKET }}/docker-images/${{ steps.meta.outputs.tag }}.tar.gz"

      # ── Retain only the last 3 tags in S3 ───────────────────────────────
      - name: Prune old images from S3 (keep last 3)
        run: |
          bash scripts/prune_s3_images.sh \
            "${{ env.S3_BUCKET }}" \
            "docker-images/" \
            3

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — Pull the tar from S3 on the EC2 instance and run the container
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy → EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout (for deploy script)
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── Write SSH key to disk ────────────────────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.EC2_HOST }}" >> ~/.ssh/known_hosts

      # ── Copy the deploy script to EC2, then execute it ───────────────────
      - name: Copy deploy script to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            scripts/deploy_on_server.sh \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/tmp/deploy_on_server.sh"

      - name: Run deploy script on EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ env.EC2_USER }}@${{ env.EC2_HOST }}" \
            "chmod +x /tmp/deploy_on_server.sh && \
             AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
             AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
             AWS_REGION='${{ env.AWS_REGION }}' \
             S3_BUCKET='${{ env.S3_BUCKET }}' \
             IMAGE_TAG='${{ needs.build-and-push.outputs.image_tag }}' \
             APP_NAME='${{ env.APP_NAME }}' \
             HOST_PORT='${{ env.HOST_PORT }}' \
             CONTAINER_PORT='${{ env.CONTAINER_PORT }}' \
             bash /tmp/deploy_on_server.sh"

      - name: Health check
        run: |
          echo "Waiting 20 s for container to start …"
          sleep 20
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://${{ env.EC2_HOST }}:${{ env.HOST_PORT }}" || echo "000")
          echo "HTTP status: ${HTTP_CODE}"
          if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "301" || "$HTTP_CODE" == "302" ]]; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed (HTTP ${HTTP_CODE}). Check the EC2 logs."
            exit 1
          fi
